services:
  # 1. Telegram Bot Service (Persistent Web/Background Worker)
  - type: worker
    name: telegram-radar-bot
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @radar/database db:generate && pnpm --filter @radar/bot build
    startCommand: pnpm --filter @radar/bot start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: radar-postgres
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: NODE_ENV
        value: production

  # 2. Worker & Scheduler Service (Persistent Cron Daemon)
  - type: worker
    name: telegram-radar-worker
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @radar/database db:generate && pnpm --filter @radar/worker build
    startCommand: pnpm --filter @radar/worker start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: radar-postgres
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-3-5-haiku-latest
      - key: CRON_SCHEDULE
        value: 0 9,20 * * *
      - key: SCHEDULE_TIMEZONE
        value: Asia/Tashkent
      - key: NODE_ENV
        value: production

databases:
  - name: radar-postgres
    databaseName: telegram_radar
    user: radar
    plan: free
